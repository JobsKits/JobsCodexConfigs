model_provider = "tokenlb"

# ═══ 切换模型：取消下面某一行的注释即可 ═══
# ——— OpenAI 旗舰 ———
model = "gpt-5.3-codex"

model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"
model_reasoning_summary = "none"
model_context_window = 1050000
model_auto_compact_token_limit = 945000
tool_output_token_limit = 6000
approval_policy = "never"
sandbox_mode = "danger-full-access"
suppress_unstable_features_warning = true

notify = ["/Users/jobs/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[model_providers.tokenlb]
name = "OpenAI"
base_url = "https://tokenlb.net/v1"
wire_api = "responses"
requires_openai_auth = false
env_key = "TOKENLB_API_KEY"
supports_websockets = true

[features]
responses_websockets_v2 = true
multi_agent = true
remote_connections = true
hooks = false
js_repl = false

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 1800

[projects."/Users/jobs/Documents/JobsOCBaseConfigDemo"]
trust_level = "trusted"

[projects."/Users/jobs/Documents/Github"]
trust_level = "trusted"

[marketplaces.openai-bundled]
last_updated = "2026-05-30T01:37:17Z"
source_type = "local"
source = "/Users/jobs/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
last_updated = "2026-05-22T07:52:02Z"
source_type = "local"
source = "/Users/jobs/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[desktop]
ambient-suggestions-enabled = true
conversationDetailMode = "STEPS_COMMANDS"

[desktop.open-in-target-preferences]
global = "xcode"

[desktop.open-in-target-preferences.perPath]
"/Users/jobs/Documents/JobsOCBaseConfigDemo" = "xcode"

[mcp_servers.node_repl]
args = []
command = "/Applications/Codex.app/Contents/Resources/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = ""
NODE_REPL_NODE_PATH = "/Applications/Codex.app/Contents/Resources/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/jobs/.codex"
CODEX_HOME = "/Users/jobs/.codex"
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "0b0d41e7a14a4903d2f95b0b3f427ed796b12c8edca2fa392a03df43997075ae"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = "Control the in-app browser in conjunction with the Browser Plugin."
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = "Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative."
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
CODEX_CLI_PATH = "/Applications/Codex.app/Contents/Resources/codex"
